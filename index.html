<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Betrayal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#000;--panel:#120506;--red:#d10f1f;--deep:#6e0610;--ink:#f2e6e6;--dim:#9a7f82;box-sizing:border-box}
*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Spectral,Georgia,serif;font-size:17px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#3a0509 0,#000 60%) no-repeat}
#app{max-width:560px;margin:0 auto;padding:18px 16px 40px}
#dot{max-width:60%;text-align:right;position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:12px;font-size:.75rem;color:var(--dim);z-index:5}
h1,h2{font-family:'Cinzel Decorative',Georgia,serif;color:var(--red);margin:.2em 0;text-align:center;text-shadow:0 0 18px #6e061099}
h1{font-size:2rem;line-height:1.15}h2{font-size:1.5rem}
p.sub{text-align:center;color:var(--dim);margin:.2em 0 1.2em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--deep);border-radius:6px;padding:14px 8px;text-align:center;color:var(--ink);font:inherit;cursor:pointer}
.card:active,.card:hover{border-color:var(--red);box-shadow:0 0 14px var(--deep)}
.card.fallen{border-color:var(--red)}
.face{width:92px;height:92px;border-radius:50%;border:2px solid var(--red);background:#1a0608 center/cover;display:flex;align-items:center;justify-content:center;font:900 2.2rem 'Cinzel Decorative',serif;color:var(--red);margin:0 auto 8px}
.card b{font-family:'Cinzel Decorative',serif;font-size:1.05rem}
.tag{color:var(--red);font-size:.8rem;margin-top:2px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;font-size:.78rem;color:var(--dim);margin:6px 10px 0}
.mini em{color:var(--ink);font-style:normal;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
button.b,a.b,label.b{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:4px;padding:9px 14px;font:600 .95rem Spectral,serif;cursor:pointer}
button.g{background:none;color:var(--dim);border:1px solid var(--deep);border-radius:4px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}
.tabs button.act{background:var(--red);color:#fff;border-color:var(--red)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.col{touch-action:none;user-select:none;-webkit-user-select:none;background:var(--panel);border:1px solid var(--deep);border-radius:6px;padding:6px}
.col.ro{touch-action:auto}
.col h3{margin:2px 0 6px;font-size:.82rem;text-align:center;color:var(--red);font-weight:600}
.cell{height:40px;margin:3px 0;border-radius:4px;background:#1c0709;display:flex;align-items:center;justify-content:center;font-size:1.15rem;color:#c9aeb0;position:relative}
.cell.st{outline:1px dashed #b33;outline-offset:-3px}
.cell.on{background:var(--red);color:#fff;font-weight:600;box-shadow:0 0 12px var(--red)}
.cell.sk{font-size:1.3rem;background:#000;border:1px solid var(--deep)}
.cell.sk.on{background:var(--deep);box-shadow:0 0 14px var(--red)}
.note{color:var(--dim);font-size:.85rem;text-align:center;margin:10px 0}
.dead{color:var(--red);text-align:center;font-family:'Cinzel Decorative',serif;margin:8px 0;min-height:1.4em}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #2a0a0d;padding:7px 0}
.row span:first-child{color:var(--dim)}
.about .face{width:130px;height:130px;font-size:3rem}
.upl{text-align:center;margin:10px 0}
label{display:block;margin:10px 0 3px;color:var(--dim);font-size:.9rem}
label.b{margin:0;color:#fff}
input,select,textarea{width:100%;background:#1a0608;color:var(--ink);border:1px solid var(--deep);border-radius:4px;padding:9px;font:inherit}
.nums{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.nums input{padding:8px 2px;text-align:center}
.chk{font-size:.9rem;margin:3px 0}.ok{color:#7fd18b}.bad{color:#ff5a66}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s,border-color .2s}}
</style></head><body><div id="dot"></div><div id="app"></div>
<script>
/* ===== PASTE YOUR SUPABASE VALUES HERE ===== */
const SB_URL='https://oluafhogfxciylsoctpi.supabase.co';
const SB_KEY='sb_publishable_JEDJlJvYoHH0A03spnYNLw_l5Mh-dXG';
/* =========================================== */
const sb=supabase.createClient(SB_URL,SB_KEY);
let liveOn=false;
const KEYS=['speed','might','sanity','knowledge'];
const LBL={speed:'Speed',might:'Might',sanity:'Sanity',knowledge:'Knowledge'};
const AB={speed:'SPD',might:'MGT',sanity:'SAN',knowledge:'KNW'};
const T=(v,s)=>({v,s});
const GEN={speed:T([2,3,3,4,5,6,7,8],4),might:T([2,3,4,5,6,6,7,8],3),sanity:T([2,3,3,4,5,6,7,7],4),knowledge:T([1,2,3,4,5,6,6,7],3)};
/* Defaults: shown until the database has data, and used by the admin "Load defaults" button */
const DEF={
Faith:{about:{hobbies:'Music, Dance, Swimming',age:'21',height:"4'8\"",weight:'Unknown',bday:'June 29, 2005',bio:'A shy electrical engineer, known as the mom of the ECE Department and the singer of Bandwidth. The slowest of the group, but sharp-minded.'},
 t:{speed:T([2,2,3,3,4,5,6,6],3),might:T([2,3,3,4,5,6,7,7],3),sanity:T([2,3,3,4,5,6,8,8],4),knowledge:T([2,3,4,5,6,7,8,8],4)}},
Dean:{about:{hobbies:'Taekwondo, Music, Video Games',age:'21',height:"5'11\"",weight:'140 lb',bday:'June 5, 2005',bio:'Black belt in Taekwondo. Electrical engineer, Dedicated Coder, lead guitar of Bandwidth, Dr. Louie\'s lapboy, and lover of Subway sandwiches.'},
 t:{speed:T([2,3,4,5,6,6,7,8],3),might:T([1,2,3,4,5,6,8,8],4),sanity:T([1,2,3,4,5,6,6,7],3),knowledge:T([2,3,3,4,5,6,7,8],4)}},
JR:{about:{hobbies:'Basketball, Music, Track, Computers',age:'20',height:"5'10\"",weight:'180 lb',bday:'December 7, 2005',bio:'Student athlete and D1 Track and Field runner who plays basketball really well. Computer engineer and drummer of Bandwidth. Has a loving girlfriend named Kayla.'},
 t:{speed:T([3,4,4,5,6,7,7,8],4),might:T([2,3,3,4,5,6,8,8],4),sanity:T([2,3,3,4,5,5,6,7],3),knowledge:T([1,2,3,4,4,5,6,7],3)}},
Cliff:{about:{hobbies:'Cooking, Computers, Music, Guitar',age:'22',height:"5'7\"",weight:'190 lb',bday:'October 7, 2004',bio:'Filipino computer engineer and bassist of Bandwidth. Plays guitar well, loves his friends, loves diet soda. Overall goat.'},
 t:{speed:T([2,3,3,4,5,5,6,6],3),might:T([2,3,3,4,5,6,7,7],4),sanity:T([2,3,3,4,5,6,7,8],4),knowledge:T([2,3,4,5,6,6,7,8],3)}},
Andrew:{about:{hobbies:'Camping, Music, Aerospace, Makerspace',age:'',height:"5'7\"",weight:'120 lb',bday:'',bio:'Electrical engineer and trumpet player of Bandwidth. League of Legends expert, arts and craftsy, makerspace specialist.'},
 t:{speed:T([2,3,4,5,5,6,7,8],3),might:T([1,2,3,4,5,5,6,7],3),sanity:T([2,3,3,4,5,6,8,8],4),knowledge:T([2,3,3,4,5,6,7,8],4)}},
Edrich:{about:null,t:GEN},Makar:{about:null,t:GEN},Brian:{about:null,t:GEN}};
const ORDER=['JR','Cliff','Dean','Andrew','Edrich','Makar','Faith','Brian'];

let CH={},LV={},adm=false,route={p:'home'},drag=null,me='',grace=0;
try{me=localStorage.getItem('betrayal-me')||''}catch(e){}
route.p=me?'home':'who';
const store=()=>{try{localStorage.setItem('betrayal-me',me)}catch(e){}};
const $=s=>document.querySelector(s),app=$('#app');
const clone=o=>JSON.parse(JSON.stringify(o));
const get=n=>CH[n]||DEF[n];
const cur=(n,k)=>{const p=LV[n]&&LV[n].pos&&LV[n].pos[k];return p===undefined?get(n).t[k].s-1:p};
const can=n=>adm||me===n;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const face=n=>{const u=LV[n]&&LV[n].photo_url;return `<div class="face" style="${u?`background-image:url(${esc(u)})`:''}">${u?'':esc(n[0])}</div>`};
const go=(p,name)=>{route={p,name};render();scrollTo(0,0)};
const fallen=n=>KEYS.some(k=>cur(n,k)===-1);

const card=x=>`<button class="card${fallen(x)?' fallen':''}" data-go="char" data-n="${x}">${face(x)}<b>${x}</b>${me===x?'<div class="tag">You</div>':''}
 <div class="mini">${KEYS.map(k=>{const c=cur(x,k);return `<span>${AB[k]} <em>${c<0?'☠':get(x).t[k].v[c]}</em></span>`}).join('')}</div></button>`;
function render(){
 const {p,name:n}=route;let h='';
 if(p==='who'){
  h=`<h1>Who are you?</h1><p class="sub">Pick your character to join the game</p><div class="grid">${ORDER.map(x=>`<button class="card" data-act="join" data-n="${x}">${face(x)}<b>${x}</b>${LV[x]&&LV[x].active?'<div class="tag">In game</div>':''}</button>`).join('')}</div>
  <p class="note">${adm?'<button class="b" data-go="home">Open lobby</button> <button class="g" data-act="logout">Log out</button>':'<button class="g" data-go="login">Admin</button>'}</p>`;
 }else if(p==='home'){
  const act=ORDER.filter(x=>LV[x]&&LV[x].active).sort((a,b)=>(b===me)-(a===me)),rest=ORDER.filter(x=>!act.includes(x));
  h=`<h1>In the game</h1><p class="sub">${act.length?act.length+(act.length>1?' players':' player'):'No one has joined yet'}</p><div class="grid">${act.map(card).join('')}</div>
  ${adm&&rest.length?`<p class="note">Not in the game (admin only)</p><div class="grid">${rest.map(card).join('')}</div>`:''}
  <p class="note">${me?'<button class="g" data-act="leave">Leave game</button> ':'<button class="g" data-go="who">Choose character</button> '}${adm?'<button class="g" data-act="seed">Load defaults</button> <button class="g" data-act="clear">Clear all players</button> <button class="g" data-act="logout">Log out</button>':''}</p>`;
 }else if(p==='login'){
  h=`<h2>Admin</h2><label>Email</label><input id="u" type="email" autocapitalize="none" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><p id="err" class="bad"></p><button class="b" data-act="login">Log in</button> <button class="g" data-go="who">Back</button>`;
 }else if(p==='char'||p==='about'){
  const d=get(n),ok=can(n);
  h=`<div class="top"><button class="g" data-go="home">← Players</button>${adm?`<button class="b" data-go="edit" data-n="${n}">Edit</button>`:''}</div>
  <h2>${n}</h2><div class="tabs"><button class="g ${p==='char'?'act':''}" data-go="char" data-n="${n}">Stats</button><button class="g ${p==='about'?'act':''}" data-go="about" data-n="${n}">About ${n}</button></div>`;
  if(p==='char'){
   h+=`<div class="dead" id="dead"></div><div class="cols">${KEYS.map(k=>{const t=d.t[k],c=cur(n,k);let cells='';
     for(let i=7;i>=0;i--)cells+=`<div class="cell${i===c?' on':''}${i===t.s-1?' st':''}" data-i="${i}">${t.v[i]}</div>`;
     cells+=`<div class="cell sk${c===-1?' on':''}" data-i="-1">☠</div>`;
     return `<div class="col${ok?'':' ro'}" data-k="${k}"><h3>${LBL[k]}</h3>${cells}</div>`}).join('')}</div>
   <p class="note">${ok?'Drag up or down on a column, or tap a number. Dashed box = starting spot. Everyone sees changes live.':'Watching '+n+' live.'}</p>${ok?`<p class="note"><button class="g" data-act="reset" data-n="${n}">Reset to starting spots</button></p>`:''}`;
  }else{
   const a=d.about;
   h+=`<div class="about">${face(n)}</div>${ok?`<p class="upl"><label class="b">📷 Upload photo<input type="file" id="photo" accept="image/*" hidden></label></p>`:''}`;
   h+=a?`<p style="text-align:center;white-space:pre-wrap">${esc(a.bio)}</p>
     ${[['Hobbies',a.hobbies],['Age',a.age],['Height',a.height],['Weight',a.weight],['Birthday',a.bday]].filter(r=>r[1]).map(r=>`<div class="row"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}`
     :`<p style="text-align:center;font-size:1.2rem;margin-top:24px">Unknown Character spooky!</p>`;
  }
 }else if(p==='edit'){
  const d=get(n),a=d.about||{};
  h=`<div class="top"><button class="g" data-go="char" data-n="${n}">← Cancel</button></div><h2>Edit ${n}</h2>
  ${[['hobbies','Hobbies'],['age','Age'],['height','Height'],['weight','Weight'],['bday','Birthday']].map(f=>`<label>${f[1]}</label><input data-a="${f[0]}" value="${esc(a[f[0]])}">`).join('')}
  <label>Bio (leave all blank for "Unknown Character")</label><textarea rows="3" data-a="bio">${esc(a.bio)}</textarea>
  ${KEYS.map(k=>`<label><b>${LBL[k]}</b> — values bottom to top (1 to 8)</label><div class="nums" data-k="${k}">${d.t[k].v.map(v=>`<input type="number" inputmode="numeric" min="0" max="9" value="${v}">`).join('')}</div>
   <label>Starting position</label><select data-s="${k}">${[1,2,3,4,5,6,7,8].map(i=>`<option ${i===d.t[k].s?'selected':''}>${i}</option>`).join('')}</select>`).join('')}
  <div id="val" style="margin-top:14px"></div><p class="bad" id="err"></p><p><button class="b" data-act="save" data-n="${n}">Save changes</button></p>`;
 }
 app.innerHTML=h;
 if(p==='char')deadText();
 if(p==='edit')validate();
}

function readT(){const t={};KEYS.forEach(k=>{t[k]={v:[...document.querySelectorAll(`.nums[data-k=${k}] input`)].map(i=>+i.value||0),s:+document.querySelector(`[data-s=${k}]`).value}});return t}
function validate(){
 const t=readT(),all=KEYS.flatMap(k=>t[k].v),sv=KEYS.map(k=>t[k].v[t[k].s-1]),sp=KEYS.map(k=>t[k].s);
 const sum=a=>a.reduce((x,y)=>x+y,0);
 const C=[['All values total 150 ('+sum(all)+')',sum(all)===150],
 ['Starting values total 15 ('+sum(sv)+')',sum(sv)===15],
 ['Starting positions total 14 or 15 ('+sum(sp)+') — '+(sum(sp)===14?'pick 3 hobbies':sum(sp)===15?'pick 2 hobbies':'invalid'),[14,15].includes(sum(sp))],
 ['Lowest value of each track is 1 to 4',KEYS.every(k=>{const m=Math.min(...t[k].v);return m>=1&&m<=4})],
 ['Highest value of each track is 5 to 8',KEYS.every(k=>{const m=Math.max(...t[k].v);return m>=5&&m<=8})],
 ['Each step up a track adds 0 to 2',KEYS.every(k=>t[k].v.every((v,i)=>i===0||(v-t[k].v[i-1]>=0&&v-t[k].v[i-1]<=2)))],
 ['Starting positions are 3, 4 or 5',sp.every(s=>s>=3&&s<=5)],
 ['Starting values are 2 to 6',sv.every(v=>v>=2&&v<=6)]];
 $('#val').innerHTML=C.map(c=>`<div class="chk ${c[1]?'ok':'bad'}">${c[1]?'✓':'✗'} ${c[0]}</div>`).join('');
}
function deadText(){const d=$('#dead');if(d)d.textContent=fallen(route.name)?'☠ This character has fallen.':''}
function paint(){document.querySelectorAll('.col').forEach(col=>{const c=cur(route.name,col.dataset.k);col.querySelectorAll('.cell').forEach(x=>x.classList.toggle('on',+x.dataset.i===c))});deadText()}

/* ---------- live data ---------- */
const wt={};
function pushPos(n){
 clearTimeout(wt[n]);
 wt[n]=setTimeout(async()=>{
  const {error}=await sb.from('live').upsert({name:n,pos:LV[n].pos,updated_at:new Date().toISOString()});
  wt[n]=0;if(error)$('#dot').textContent='⚠ Not saving';
 },120);
}
function setPos(n,v){LV[n]=LV[n]||{pos:{}};LV[n].pos=v;pushPos(n)}
function pick(col,y){
 const cs=[...col.querySelectorAll('.cell')];let b=cs[0];
 for(const c of cs)if(y>=c.getBoundingClientRect().top)b=c;
 const v=+b.dataset.i,n=route.name,k=col.dataset.k;
 if(cur(n,k)===v)return;
 setPos(n,Object.assign({},LV[n]&&LV[n].pos,{[k]:v}));
 cs.forEach(c=>c.classList.toggle('on',+c.dataset.i===v));deadText();
 if(navigator.vibrate)navigator.vibrate(8);
}
const busy=n=>wt[n]||(drag&&route.name===n);
function checkMe(){
 if(!me||adm||Date.now()<grace)return false;
 const l=LV[me];
 if(l&&l.active===false){me='';store();go('who');return true}
 return false;
}
function onLive(n){
 if(checkMe())return;
 if(busy(n))return;
 if(route.p==='home'||route.p==='who'||(route.p==='about'&&route.name===n))render();
 else if(route.p==='char'&&route.name===n)paint();
}
function onChars(){
 if(drag||!['who','home','char','about'].includes(route.p))return;render();
}
async function load(){
 try{
  const [a,b]=await Promise.all([sb.from('characters').select('*'),sb.from('live').select('*')]);
  const bad=a.error||b.error;
  if(bad)$('#dot').textContent='⚠ '+bad.message;
  (a.data||[]).forEach(r=>CH[r.name]={about:r.about,t:r.tracks});
  (b.data||[]).forEach(r=>{if(!busy(r.name))LV[r.name]={pos:r.pos||{},photo_url:r.photo_url,active:r.active}});
 }catch(e){$('#dot').textContent='⚠ '+(e.message||e)}
 if(checkMe())return;
 if(!drag&&['who','home','char','about'].includes(route.p))render();
}
sb.channel('betrayal')
 .on('postgres_changes',{event:'*',schema:'public',table:'live'},p=>{const r=p.new;if(r&&r.name){if(!busy(r.name))LV[r.name]={pos:r.pos||{},photo_url:r.photo_url,active:r.active};onLive(r.name)}})
 .on('postgres_changes',{event:'*',schema:'public',table:'characters'},p=>{const r=p.new;if(r&&r.name){CH[r.name]={about:r.about,t:r.tracks};onChars()}})
 .subscribe((s,err)=>{
  liveOn=s==='SUBSCRIBED';
  $('#dot').textContent=liveOn?'● Live':'○ '+s+(err&&err.message?': '+err.message:'');
  if(liveOn)load();
 });
setInterval(()=>{if(!liveOn&&!drag)load()},4000);
sb.auth.getSession().then(({data})=>{adm=!!data.session;render()});
sb.auth.onAuthStateChange((_e,s)=>{adm=!!s});

/* ---------- photos ---------- */
function upPhoto(f,n){
 const img=new Image();
 img.onerror=()=>alert('Could not read that photo. Try a different one.');
 img.onload=()=>{
  const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=400;
  c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,400,400);
  c.toBlob(async blob=>{
   try{
    const path=n.toLowerCase()+'-'+Date.now()+'.jpg';
    const u=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});
    if(u.error)throw u.error;
    const url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
    const r=await sb.from('live').upsert({name:n,photo_url:url});
    if(r.error)throw r.error;
    LV[n]=Object.assign(LV[n]||{pos:{}},{photo_url:url});render();
   }catch(e){alert('Upload failed: '+(e.message||e))}
  },'image/jpeg',.85);
 };
 img.src=URL.createObjectURL(f);
}

/* ---------- events ---------- */
app.addEventListener('pointerdown',e=>{const col=e.target.closest('.col');if(!col||route.p!=='char'||!can(route.name))return;drag=col;col.setPointerCapture(e.pointerId);pick(col,e.clientY)});
app.addEventListener('pointermove',e=>{if(drag)pick(drag,e.clientY)});
['pointerup','pointercancel'].forEach(t=>app.addEventListener(t,()=>{drag=null}));

app.addEventListener('click',async e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,g.dataset.n||route.name);return}
 const a=e.target.closest('[data-act]');if(!a)return;const n=a.dataset.n,act=a.dataset.act;
 if(act==='login'){
  const {error}=await sb.auth.signInWithPassword({email:$('#u').value.trim(),password:$('#pw').value});
  if(error)$('#err').textContent=error.message;else{adm=true;go('home')}
 }
 if(act==='logout'){await sb.auth.signOut();adm=false;go(me?'home':'who')}
 if(act==='join'){
  me=n;store();grace=Date.now()+4000;
  LV[n]=Object.assign(LV[n]||{pos:{}},{active:true});go('home');
  const {error}=await sb.from('live').upsert({name:n,active:true,updated_at:new Date().toISOString()});
  if(error){alert('Could not join: '+error.message);LV[n].active=false;me='';store();go('who')}
 }
 if(act==='leave'){
  const n0=me;me='';store();if(LV[n0])LV[n0].active=false;go('who');
  await sb.from('live').upsert({name:n0,active:false,updated_at:new Date().toISOString()});
 }
 if(act==='clear'){
  const {error}=await sb.from('live').update({active:false}).neq('name','');
  if(error)alert(error.message);
 }
 if(act==='reset'){setPos(n,{});render()}
 if(act==='seed'){
  const {error}=await sb.from('characters').upsert(ORDER.map(x=>({name:x,about:DEF[x].about,tracks:DEF[x].t})));
  a.textContent=error?error.message:'Loaded';
 }
 if(act==='save'){
  const ab={};document.querySelectorAll('[data-a]').forEach(i=>ab[i.dataset.a]=i.value.trim());
  const about=Object.values(ab).some(x=>x)?ab:null,tracks=readT();
  const {error}=await sb.from('characters').upsert({name:n,about,tracks,updated_at:new Date().toISOString()});
  if(error){$('#err').textContent=error.message;return}
  CH[n]={about,t:tracks};go('char',n);
 }
});
app.addEventListener('input',e=>{if(route.p==='edit'&&e.target.closest('.nums'))validate()});
app.addEventListener('change',e=>{
 if(route.p==='edit'&&e.target.dataset.s)validate();
 if(e.target.id==='photo'){const f=e.target.files[0];if(f)upPhoto(f,route.name)}
});
render();load();
</script></body></html>
